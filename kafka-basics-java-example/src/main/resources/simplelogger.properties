# Configuração do slf4j-simple (o logger usado pelos demos).
# Mostramos INFO para as mensagens dos demos e deixamos os logs internos do
# Kafka só em WARN, assim a saída fica limpa e você enxerga o que importa.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
